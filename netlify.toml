[build]
  base = "web"
  command = "pnpm build"
  publish = "build"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.17.1"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "private, no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

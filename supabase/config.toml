project_id = "configains"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]
jwt_expiry = 3600
enable_signup = false

# Invitation and password-reset emails. A hosted project sends the templates saved in the Supabase
# dashboard, so paste these files there too (Authentication > Emails). `supabase config push` would
# apply them for you, but it also pushes site_url above: change that to the live site first.
[auth.email]
# Invitation links last 24 hours (the dashboard maximum) so a client can open one the next day.
otp_expiry = 86400

[auth.email.template.invite]
subject = "You're invited to Configains"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Reset your Configains password"
content_path = "./supabase/templates/recovery.html"

[storage]
enabled = true
file_size_limit = "4MiB"


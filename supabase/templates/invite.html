<!doctype html>
<html lang="en">
  <body style="margin:0;padding:32px 16px;background:#182a30;font-family:Arial,sans-serif;color:#182a30">
    <div style="max-width:480px;margin:0 auto;padding:32px;background:#fcfdfb;border-radius:12px">
      <p style="font-size:24px;font-weight:bold;letter-spacing:1px">CONFIGAINS.</p>
      <h1 style="font-size:28px;line-height:1.2">You have been invited</h1>

      <p style="margin:28px 0">
        <a href="{{ .SiteURL }}/account/accept-invite?token_hash={{ .TokenHash }}" style="display:inline-block;padding:14px 20px;background:#59d9e8;color:#182a30;border-radius:6px;font-weight:bold;text-decoration:none">Accept invitation</a>
